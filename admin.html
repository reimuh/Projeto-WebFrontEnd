<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>

    <link rel="stylesheet" href="global.css">
    <script defer src="app.js"></script>
</head>
<body>

    <div class="container">
        <video class="video-fundo" loop autoplay muted playsinline src="videos/background2.mp4"></video>

        <header>
            <div class="hdlogo">
                <img src="images/logo.png" alt="Logo">
                <h1><span style="color: rgb(127, 11, 173)">Página:</span> Admin</h1>
            </div>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login/Cadastro</a></li>

            </ul>
        </header>

        <main class="admin-content">
            <h2>Cadastro de Usuários</h2>

            <form id="formAdmin">
                <div class="input-admin">
                    <input type="text" id="nome" placeholder="Nome de Usuário" required>
                    <input type="email" id="email" placeholder="E-mail" required>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <input type="tel" id="telefone" placeholder="Telefone" required>
                    <input type="date" id="dataNasc" required>
                </div>
                <div class="botoes-admin">
                    <button type="submit" id="btnCadastrar">Cadastrar</button>
                    <button type="button" id="btnLimpar">Limpar Campos</button>
                    <button type="button" id="btnExcluirTudo">Excluir Todos</button>
                </div>
            </form>

            <div class="pesquisa-admin">
                <input type="text" id="campoPesquisa" placeholder="Pesquisar nome, e-mail, telefone...">
            </div>

            <ul id="listaUsuarios"></ul>
        </main>
    </div>

    <footer>
        <p>Projeto <span style="color: rgb(190, 29, 253)">WebFrontEnd</span> | André Born | 
        <a href="link/curriculo.pdf" target="_blank" class="pdf-cur">Currículo</a></p>
    </footer>
</body>
</html>
