<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="global.css">
    
</head>
<body>
    <video class="video-fundo" loop autoplay muted playsinline src="videos/background4.mp4"></video>

    <header>
        <div class="hdlogo">
            <img src="images/logo.png" alt="Logo">
            <h1><span style="color: rgb(168, 14, 230)">Página:</span> Login</h1>
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="admin.html">Admin</a></li>
        </ul>
    </header>

    <div class="texto-login">
        <h2>Bem-<span style="color: rgb(148, 37, 192)">vindo!</span></h2>
        <p>Entre com seu nome de usuário e senha abaixo, ou crie uma conta.</p>
    </div>

<div class="login-container">

    <div class="forms-container" id="formsContainer">

        <div class="forms forms-login active">
            <div class="input">
                <input type="text" placeholder="Usuário" required>
                <input type="password" placeholder="Senha" required>
                <button class="btt-login">Entrar</button>
                <button class="btt-cadastro" id="abrirCadastro">Cadastrar-se</button>
            </div>
        </div>

        <div class="forms forms-cadastro">
            <div class="input">
            <form id="formAdmin">
                <div class="input-admin">
                    <input type="text" id="nome" placeholder="Nome de Usuário" required>
                    <input type="email" id="email" placeholder="E-mail" required>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <input type="tel" id="telefone" placeholder="Telefone" required>
                    <input type="date" id="dataNasc" required>
                </div>
                <div class="botoes-admin">
                    <button type="submit" id="btnCadastrar">Cadastrar</button>
                </div>

                <button class="btt-cadastro" id="voltarLogin">Voltar</button>
            </form>
            </div>
        </div>
    </div>
</div>

    <footer>
        <p>Projeto <span style="color: rgb(190, 29, 253)">WebFrontEnd</span>. | André Born. | 
        <a href="link/curriculo.pdf" target="_blank" class="pdf-cur">Currículo.</a></p>
    </footer>

    <script src="app.js"> </script>
</body>

</html>
